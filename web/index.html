<!doctype html>
<meta charset="utf-8">
<title>3dworld — viewport</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f11; color: #c8ccd2;
               font: 13px/1.5 ui-monospace, monospace; }
  #stage { display: grid; grid-template-rows: 1fr auto; height: 100%; }
  #viewport { position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #status { padding: .6rem .9rem; border-top: 1px solid #24272c; white-space: pre-wrap; }
  .warn { color: #e8a13c; }
  .bad { color: #e06c5a; }
</style>
<div id="stage">
  <!-- The canvas is created by the loader, not written here: a canvas keeps
       the first context it is given, so falling back from WebGPU to WebGL2
       means replacing the element. -->
  <div id="viewport"></div>
  <div id="status">starting…</div>
</div>
<!-- GitHub Pages cannot send COOP and COEP, so a service worker supplies
     them and the page reloads once under it. This has to be a classic script,
     loaded before the module below: it reads `document.currentScript` to find
     its own URL, and module scripts are deferred, so a module here would run
     after the boot it is meant to precede. See web/coi-serviceworker.js. -->
<script src="./coi-serviceworker.js"></script>
<script type="module">
  import { boot, distinctColours } from './loader.js';

  const container = document.getElementById('viewport');
  const status = document.getElementById('status');

  // Everything the page learns is also hung off `window.__w3d`, because that
  // is what a headless browser reads. The test and the user see the same
  // facts — a test that inspects something the page does not show is a test
  // that can pass while the page is blank.
  const state = { ready: false, frames: 0, error: null, picks: [] };
  window.__w3d = state;

  try {
    // Boot after the isolation question is settled, not before. On a first
    // visit to a host that sends no headers the service worker is about to
    // reload the page, and a wasm module fetched now is a megabyte thrown
    // away. `ready` resolves when there is nothing left to wait for; on the
    // reloading path it never resolves, and this line is where the page waits.
    const coi = globalThis.__w3dCOI;
    if (coi) await coi.ready;
    state.coi = coi ? coi.note : null;

    // `?worker=fail` points the loader at a worker that does not exist, so
    // that the main-thread fallback is reached through a real failure rather
    // than through a flag that skips the attempt. The page's own hook, in the
    // same spirit as `?coi=off` above.
    const query = new URLSearchParams(location.search);
    const forceWorkerFailure = query.get('worker') === 'fail';
    // `?doc=off` points the loader at a document that is not there, so the
    // worker falls back to the scene compiled into it. That is the state of a
    // deployment where `make web-scene` has not run, and it must be a branch
    // the suite asserts rather than the one it happens to take.
    const forceNoDocument = query.get('doc') === 'off';

    // While the worker works, this thread is supposed to be free. That is the
    // entire benefit of the boot path and it is invisible — the picture at the
    // end is identical either way — so it is *measured*, here, by the cheapest
    // thing that can only happen on an unblocked thread: a frame callback.
    //
    // `maxStallMs` is the number that matters, not the tick count. A thread
    // meshing a solid synchronously produces one enormous gap between
    // consecutive callbacks, the length of the mesh; a free one produces gaps
    // of a frame. It is a direct measurement of "was this thread blocked", and
    // it needs no baseline from another build — `?worker=fail` meshes here, so
    // the suite has the blocked case as a control.
    const spin = ['|', '/', '-', '\\'];
    let ticks = 0;
    let maxStallMs = 0;
    let ticking = true;
    let lastTick = performance.now();
    const startedBoot = lastTick;
    const tick = () => {
      // Checked first, not last. Clearing `ticking` does not cancel the frame
      // already queued, so a final callback fires *after* boot has finished and
      // overwrites the status bar with a spinner — which is what it did: three
      // checks that read the status found "meshing in a worker…" on a page that
      // had long since finished.
      if (!ticking) return;
      const now = performance.now();
      // Skipped on the first callback: the gap before it is page setup, not a
      // stall this page caused.
      if (ticks > 0) maxStallMs = Math.max(maxStallMs, now - lastTick);
      lastTick = now;
      ticks += 1;
      // The spinner, and it is not decoration: a thread that is blocked cannot
      // paint one. It is the same fact as `maxStallMs`, in the form a user
      // reads.
      status.textContent = `${spin[ticks % spin.length]} meshing in a worker…`;
      if (ticking) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    let booted;
    try {
      booted = await boot(container, {
        workerUrl: forceWorkerFailure ? './worker-that-does-not-exist.js' : undefined,
        documentUrl: forceNoDocument ? './no-such-scene.w3d' : undefined,
      });
    } finally {
      ticking = false;
    }
    // The gap that the loop above cannot see, and on the blocking path it is
    // the only one that matters: measuring a stall needs a callback on the far
    // side of it, and a thread that meshes synchronously right up to the end of
    // boot never gets one. Without this line the blocked case reported a
    // longest stall of 24 ms — a frame — while it had in fact been blocked for
    // most of a second, which would have made the whole measurement a
    // decoration that always agreed with whoever wrote it.
    maxStallMs = Math.max(maxStallMs, performance.now() - lastTick);
    state.boot = {
      ticks,
      maxStallMs: Math.round(maxStallMs),
      ms: Math.round(performance.now() - startedBoot),
    };

    const { viewer, canvas, module, caps, wanted, chosen, note, graphics,
            meshNote, wire, report } = booted;
    Object.assign(state, {
      caps, wanted, chosen, note, graphics, meshNote, report, viewer,
      // What the boot path's worker reported about itself. Null when the
      // worker could not run and the scene was meshed here instead.
      wire: wire && {
        chunks: wire.chunks.length,
        bytes: wire.bytes,
        claimed: wire.claimed,
        transferred: wire.transferred,
        bodies: wire.bodies,
        source: wire.source,
        initMs: wire.initMs,
        modelMs: wire.modelMs,
        tessellateMs: wire.tessellateMs,
        encodeMs: wire.encodeMs,
        modelled: wire.modelled,
      },
    });

    const dpr = Math.min(globalThis.devicePixelRatio || 1, 2);
    const fit = () => {
      const w = Math.max(1, Math.round(container.clientWidth * dpr));
      const h = Math.max(1, Math.round(container.clientHeight * dpr));
      canvas.width = w;
      canvas.height = h;
      viewer.resize(w, h);
    };
    fit();
    // Observed on the *container*, not on the window, and the difference was
    // measured rather than reasoned about. The status bar below the viewport
    // grows from one line to six the moment the page has anything to say, and
    // the grid takes that space out of the viewport — with no window resize,
    // so a `resize` listener never fires. `fit` therefore ran once, against a
    // 624-pixel-tall box, and the canvas kept a 624-pixel backing store inside
    // a box that was now 468 pixels tall.
    //
    // That is invisible while nothing maps a screen coordinate back into the
    // buffer: the image is simply scaled to fit. The pick does map one, so
    // every click was being read a third of the height away from where it
    // landed — and it went unnoticed because the plate is large and centred
    // and absorbed the error. A seventh status line, on the worker-failure
    // path, was what finally pushed a centre click off the part.
    new ResizeObserver(fit).observe(container);

    let dragging = null;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = { x: e.clientX, y: e.clientY, moved: false };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragging.moved = true;
      viewer.orbit(-dx * 0.01, dy * 0.01);
      dragging.x = e.clientX;
      dragging.y = e.clientY;
    });
    canvas.addEventListener('pointerup', (e) => {
      // A drag that orbited is not a click. Otherwise every rotation ends by
      // selecting whatever the cursor stopped over.
      if (dragging && !dragging.moved) {
        const r = canvas.getBoundingClientRect();
        pick((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
      }
      dragging = null;
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      viewer.dolly(Math.exp(e.deltaY * 0.001));
    }, { passive: false });

    // Picks are submitted here and collected in the frame loop, because a GPU
    // readback finishes on the event loop and not in the handler that asked
    // for it.
    globalThis.__w3dPick = pick;
    function pick(x, y) {
      viewer.pickBegin(Math.round(x), Math.round(y));
    }

    const frame = () => {
      viewer.render();
      state.frames += 1;
      const hit = viewer.pickCollect();
      if (hit) {
        state.lastPick = hit;
        state.picks.push(hit);
        show(hit);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);

    // Render and sample in one task, because a WebGL2 drawing buffer does not
    // survive being composited — see `distinctColours`. Exposed so that a
    // headless run can ask the page what it is actually showing rather than
    // guess from a screenshot's byte count.
    state.sample = () => {
      viewer.render();
      return distinctColours(canvas);
    };

    // The comparison the worker boundary used to get for free.
    //
    // While the main thread meshed at startup and the worker's result replaced
    // it afterwards, "the same triangles arrived by a different route" was a
    // before-and-after on one viewer and cost nothing to assert. Now the
    // worker goes first and there is no `before` — so the reference has to be
    // built on purpose: tessellate the same scene on *this* thread, install it
    // through the same wire path, and require the picture not to change.
    //
    // It proves the same thing in the opposite direction. Two independent
    // tessellations, in two linear memories, of one document, agree.
    state.compareWithMainThread = (chunksPerBody = 4) => {
      const before = {
        triangles: viewer.triangles(),
        colours: state.sample(),
        meshedBy: viewer.report().meshedBy,
      };

      const started = performance.now();
      const local = module.tessellateScene(chunksPerBody);
      const onThisThreadMs = performance.now() - started;

      // Copied out before `installWire` is called, and the reason is a hazard
      // rather than a preference: if these were views into this module's
      // linear memory, the allocation `installWire` makes to copy chunk 0 in
      // could grow that memory, and growing it detaches every outstanding
      // view — so chunk 1 would arrive empty, or throw. Whether they *are*
      // views is measured rather than assumed: `chunkBuffer` below reports the
      // backing buffer's size against the chunk's own. Equal means js-sys
      // handed back a copy on the JS heap and this precaution is free
      // insurance; very much larger means it is load-bearing.
      const chunkBuffer = local.chunks.length
        ? { chunk: local.chunks[0].length, buffer: local.chunks[0].buffer.byteLength }
        : null;
      const chunks = local.chunks.map((c) => {
        const copy = new Uint8Array(c.length);
        copy.set(c);
        return copy;
      });

      const bodies = viewer.installWire(chunks, {
        tessellateMs: local.tessellateMs,
        modelled: local.modelled,
        // Made right here, and said so. Passing `true` would turn `meshedBy`
        // into a decoration that always agrees with whoever wrote the caller.
        fromWorker: false,
        // `tessellateScene` builds the compiled-in scene; it never opens a
        // document. This is the reference the boot path is compared against.
        source: 'built-in scene',
      });

      const after = {
        triangles: viewer.triangles(),
        colours: state.sample(),
        meshedBy: viewer.report().meshedBy,
      };
      state.comparison = {
        bodies,
        chunks: chunks.length,
        onThisThreadMs,
        chunkBuffer,
        modelled: local.modelled,
        before,
        after,
      };
      return state.comparison;
    };

    state.ready = true;
    show(null);

    function show(hit) {
      const lines = [
        `${report.backend} · ${report.adapter} · ${report.acceleration}`,
        `compute ${report.compute ? 'yes' : 'NO'} · vertex storage ` +
          `${report.vertexStorageBuffers ? 'yes' : 'NO'} · ` +
          `${report.triangles} triangles${report.deindexed ? ' (de-indexed)' : ''}` +
          // `meshedBy` and not just a duration. A boot that fell back to
          // meshing on this thread draws the same picture in the same time and
          // is the thing the worker exists to prevent; without this word on
          // the screen, nobody would ever notice it had happened.
          ` · meshed in ${report.tessellateMs.toFixed(1)} ms by ${report.meshedBy}` +
          // Two independent facts on one line, because the interesting cases
          // are the mixed ones: a document meshed on the main thread, or the
          // built-in scene meshed in the worker, each of which means a
          // different thing went wrong and both of which look identical.
          ` · from ${report.source}` +
          (report.modelled === null ? '' : report.modelled ? ' (cut)' : ' (NOT cut)'),
        // `pool` is rayon's own count, not the variant's name. A threaded
        // build whose workers never started says `pool 1` here and would say
        // `variant threaded` on the same line — showing both is what makes
        // that visible instead of flattering.
        `boot ${state.boot.ms} ms · ${state.boot.ticks} frames while it worked · ` +
          `longest stall ${state.boot.maxStallMs} ms`,
        `variant ${chosen}${chosen === wanted ? '' : ` (wanted ${wanted})`} · ` +
          `threads ${caps.threads ? 'yes' : 'no'} (pool ${report.threads}) · ` +
          `isolated ${caps.isolated ? `yes (${caps.isolatedBy})` : 'no'} · ` +
          `simd ${caps.simd ? 'yes' : 'no'}`,
      ];
      if (hit) {
        lines.push(hit.object === null
          ? 'clicked: nothing'
          : `clicked: body ${hit.object}, face ${hit.face}`);
      }
      status.textContent = lines.join('\n');
      status.className = '';
      for (const text of [
        note,
        graphics,
        meshNote,
        report.softwareRendering,
        report.degradation,
        state.coi,
      ]) {
        if (!text) continue;
        status.textContent += `\n${text}`;
        status.className = 'warn';
      }
    }
  } catch (e) {
    state.error = String(e && e.message ? e.message : e);
    status.textContent = state.error;
    status.className = 'bad';
  }
</script>
