[package]
name = "w3d-web"
description = "The browser half: a canvas becomes a wgpu surface, and the loader is told what it got."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is what wasm-bindgen needs; `rlib` keeps `cargo check` on the host
# meaningful, where the crate compiles to nothing at all.
[lib]
crate-type = ["cdylib", "rlib"]

# Everything is behind `cfg(target_arch = "wasm32")`, including the
# dependencies. A native `cargo check` therefore builds an empty crate rather
# than dragging wasm-bindgen into the host build — and `make test` stays a
# command that needs no browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
w3d-core = { path = "../core" }
w3d-kernel-fake = { path = "../kernel-fake" }
w3d-render = { path = "../render" }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "webgpu",
    "webgl",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "Window", "console"]

[lints]
workspace = true
