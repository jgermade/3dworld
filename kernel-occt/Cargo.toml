[package]
name = "w3d-kernel-occt"
description = "The OpenCASCADE backend. The only crate in this workspace that contains unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
links = "w3d_occt"

[dependencies]
w3d-kernel = { path = "../kernel" }

# The browser's OpenCASCADE is a second wasm module, and the only way from
# this one to that one is through JS — see `src/remote.rs`. The same crate
# and version `w3d-web` already uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"

# Deliberately NOT `[lints] workspace = true`. The workspace forbids unsafe,
# and `forbid` cannot be relaxed by a crate that inherits it — which is the
# point: unsafe exists in exactly one crate, the FFI boundary, and opting out
# of the shared lint is a visible act rather than an `#[allow]` buried in a file.
[dev-dependencies]
w3d-core = { path = "../core" }
w3d-format = { path = "../format" }
w3d-kernel-fake = { path = "../kernel-fake" }
# Real geometry through the real viewport. `render/` cannot depend on this
# crate — it must not know a backend exists — so the end-to-end test lives on
# this side of the seam, where OCCT is already a prerequisite.
w3d-render = { path = "../render" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"

[lints.rust]
unsafe_code = "allow"
