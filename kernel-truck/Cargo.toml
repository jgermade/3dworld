[package]
name = "w3d-kernel-truck"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
w3d-kernel = { path = "../kernel", features = ["conformance"] }
truck-modeling = "0.6.0"
truck-topology = "0.6.0"
truck-geometry = "0.5.0"
truck-polymesh = "0.6.0"
truck-stepio = "0.3.0"
truck-base = "0.5.0"
# Only ever enabled through a feature. rayon on `wasm32-unknown-unknown` needs
# a build with atomics and a pool somebody started — `web`'s `threads` feature
# is the only thing that turns this on, and `make check` never sees it.
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
truck-shapeops = "0.4.0"
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }

[features]
## Meshes a solid's faces at once instead of one after another. The output is
## identical either way — see `tessellate` — so this is a speed switch and not
## a behaviour one, and `tessellation_is_independent_of_the_thread_count`
## asserts exactly that by pinning the same fingerprint under both settings.
parallel = ["dep:rayon"]
