[workspace]
resolver = "3"
members = ["kernel", "kernel-fake", "kernel-occt", "core", "render", "web", "app"]
# kernel-occt needs OpenCASCADE headers and libraries present, so it is not a
# default member: `cargo test` stays a no-setup command. Run it explicitly with
# `cargo test -p w3d-kernel-occt`, or `make test-occt`.
default-members = ["kernel", "kernel-fake", "core", "render", "web", "app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
